<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Loop — find the help that exists, activate the help that doesn't</title>
    <meta name="description" content="Loop connects real programs with neighborhood help: AI plans for families, surplus food from local businesses, and safe missions for student volunteers. English and Spanish." />
    <meta name="theme-color" content="#0F766E" />
    <meta property="og:title" content="Loop: find the help that exists. Activate the help that doesn't." />
    <meta property="og:description" content="Neighborhood mutual aid, made safe and simple." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved or system color theme before first paint (avoids a flash).
      try {
        var t = localStorage.getItem('loop.theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
        var l = localStorage.getItem('loop.lang');
        if (l === 'es' || l === 'en') document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Loop needs JavaScript. For help now, dial 2-1-1 from any phone.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
